[tox]
env_list = py{3.10,3.11,3.12,3.13,3.14},py{3.10,3.11,3.12,3.13,3.14}-ml,py{3.10,3.11,3.12,3.13,3.14}-verify-install,py{310,311,312,313,314}-notebooks

[gh-actions]
python =
    3.10: py3.10,py3.10-ml,py3.10-verify-install
    3.11: py3.11,py3.11-ml,py3.11-verify-install
    3.12: py3.12,py3.12-ml,py3.12-verify-install
    3.13: py3.13,py3.13-ml,py3.13-verify-install
    3.14: py3.14,py3.14-ml,py3.14-verify-install

[testenv]
set_env =
    PYTHONPATH = {toxinidir}
    # some ml dependencies (e.g. dm-tree) build from source on newer Pythons and bundle very old
    # CMakeLists.txt files; recent cmake (>=4.0) hard-errors on these unless told to allow them.
    CMAKE_POLICY_VERSION_MINIMUM = 3.5
# HTTP_PROXY and HTTPS_PROXY are required behind corporate proxies
pass_env =
    DISPLAY
    XAUTHORITY
    HTTP_PROXY
    HTTPS_PROXY

[testenv:requirements]
base_python = python3.13
skip_install = true
deps =
    pip-tools
commands =
    # remove requirements-*.txt as otherwise the dependencies are not properly updated
    python -c 'import os; os.remove("requirements.txt")  if os.path.exists("requirements.txt") else None'
    python -c 'import os; os.remove("requirements-dev.txt")  if os.path.exists("requirements-dev.txt") else None'
    python -c 'import os; os.remove("requirements-ml.txt")  if os.path.exists("requirements-ml.txt") else None'
    python -m piptools compile -o requirements.txt pyproject.toml
    python -m piptools compile --extra dev -o requirements-dev.txt pyproject.toml
    python -m piptools compile --extra ml -o requirements-ml.txt pyproject.toml

[testenv:py{3.10,3.11,3.12,3.13,3.14}]
platform = linux|linux2|darwin
deps =
    -r requirements-dev.txt
set_env =
    # tox does not merge a subsection's set_env with [testenv]'s - it replaces it outright - so every
    # subsection below that needs its own extra keys (like this one) must re-pull in the base's via this
    # substitution, or lose PYTHONPATH/CMAKE_POLICY_VERSION_MINIMUM silently.
    {[testenv]set_env}
    BENCHMARK_EPISODES_FOLDER = {tox_root}/episodes
    # avoids a real race under -n auto on a cold checkout: concurrent xdist workers compiling+writing the
    # same module's __pycache__/*.pyc simultaneously can trigger "EOFError: marshal data too short".
    PYTHONDONTWRITEBYTECODE = 1
commands =
    python --version
    python -m pytest -n auto {posargs} --ignore=tests/ml -m "not slow"

[testenv:py{3.10,3.11,3.12,3.13,3.14}-ml]
platform = linux|linux2|darwin
set_env =
    {[testenv]set_env}
    BENCHMARK_EPISODES_FOLDER = {tox_root}/episodes
    # see the py{...} testenv above for why this is needed alongside -n auto.
    PYTHONDONTWRITEBYTECODE = 1
deps =
    -r requirements-dev.txt
    -r requirements-ml.txt
commands =
    python --version
    python -m pytest -n auto --retries 2 --retry-delay 5 {posargs} tests/ml

[testenv:lint]
base_python = python3.14
skip_install = true
deps =
    -r requirements-dev.txt
commands =
    flake8 flatland tests examples benchmarks

[flake8]
exclude = docs
max-line-length = 120
ignore = E121 E126 E123 E128 E133 E226 E241 E242 E704 W291 W293 W391 W503 W504 W505


[testenv:coverage]
base_python = python3.14
skip_install = true
deps =
    -r requirements-dev.txt
commands =
    python scripts/make_coverage.py


[testenv:py{3.10,3.11,3.12,3.13,3.14}-profiling]
deps =
    -r requirements-dev.txt
set_env =
    {[testenv]set_env}
    PROFILING_OUTPUT_FOLDER = {work_dir}/{env_name}/log
    SCENARIOS_FOLDER = {tox_root}/scenarios
    NUM_RUNS=5
commands =
    python --version
    python benchmarks/profile_all_examples.py

    python -m pip install graphviz # compatibility with old flatland-rl versions
    # https://setuptools.pypa.io/en/stable/history.html v82.0.0:
    # pkg_resources has been removed from Setuptools. Most common uses of pkg_resources have been superseded by the importlib.resources and importlib.metadata projects.
    # Projects and environments relying on pkg_resources for namespace packages or other behavior should depend on older versions of setuptools. (#3085)
    python -m pip install -U "setuptools<v82.0.0" # Therefore, pin setuptools to <v82.0.0

    python -m jupyter nbconvert --debug --ExecutePreprocessor.timeout=1800 --execute --to notebook --inplace benchmarks/flatland_performance_profiling.ipynb

[testenv:py{3.10,3.11,3.12,3.13,3.14}-profiling-get-k-shortest-paths]
deps =
    -r requirements-dev.txt
set_env =
    {[testenv]set_env}
    ECML2026_PKL = {tox_root}/level_0_scenario_1.pkl
    ECML2026_STATIONS_PKL = {tox_root}/stations.pkl
    NUM_RUNS=5
commands =
    python --version

    python -m pip install graphviz # compatibility with old flatland-rl versions
    # https://setuptools.pypa.io/en/stable/history.html v82.0.0:
    # pkg_resources has been removed from Setuptools. Most common uses of pkg_resources have been superseded by the importlib.resources and importlib.metadata projects.
    # Projects and environments relying on pkg_resources for namespace packages or other behavior should depend on older versions of setuptools. (#3085)
    python -m pip install -U "setuptools<v82.0.0" # Therefore, pin setuptools to <v82.0.0

    python -m jupyter nbconvert --debug --ExecutePreprocessor.timeout=1800 --execute --to notebook --inplace benchmarks/benchmark_k_shortest_paths_profiling.ipynb

[testenv:py{3.10,3.11,3.12,3.13,3.14}-examples]
platform = linux|linux2|darwin
deps =
    -r requirements-dev.txt
set_env =
    {[testenv]set_env}
    SCENARIOS_FOLDER = {tox_root}/scenarios
commands =
    python --version
    python benchmarks/run_all_examples.py

[testenv:py{3.10,3.11,3.12,3.13,3.14}-notebooks]
platform = linux|linux2|darwin
allowlist_externals =
    bash
    pwd
deps =
    -r requirements-dev.txt
commands =
    python --version
    python -m jupyter nbconvert --ExecutePreprocessor.timeout=120 --execute --to notebook --inplace notebooks/Agent-Close-Following.ipynb
    python -m jupyter nbconvert --ExecutePreprocessor.timeout=120 --execute --to notebook --inplace notebooks/flatland_animate.ipynb
    python -m jupyter nbconvert --ExecutePreprocessor.timeout=120 --execute --to notebook --inplace notebooks/graph_demo.ipynb
    python -m jupyter nbconvert --ExecutePreprocessor.timeout=120 --execute --to notebook --inplace notebooks/interactiveai.ipynb
    python -m jupyter nbconvert --ExecutePreprocessor.timeout=120 --execute --to notebook --inplace notebooks/render_episode.ipynb
    python -m jupyter nbconvert --ExecutePreprocessor.timeout=120 --execute --to notebook --inplace notebooks/scene_editor.ipynb
    python -m jupyter nbconvert --ExecutePreprocessor.timeout=120 --execute --to notebook --inplace notebooks/simple_example_manual_control.ipynb
    python -m jupyter nbconvert --ExecutePreprocessor.timeout=120 --execute --to notebook --inplace notebooks/simple_rendering_demo.ipynb
    python -m jupyter nbconvert --ExecutePreprocessor.timeout=120 --execute --to notebook --inplace notebooks/test_saved_envs.ipynb
    python -m jupyter nbconvert --ExecutePreprocessor.timeout=120 --execute --to notebook --inplace notebooks/test_service.ipynb
    python -m jupyter nbconvert --ExecutePreprocessor.timeout=120 --execute --to notebook --inplace notebooks/trajectories.ipynb
# TODO https://github.com/flatland-association/flatland-rl/issues/132 skipped notebooks - drop or run?
# TODO https://github.com/flatland-association/flatland-rl/issues/132 notebooks are mixture of illustration and tests - move test notebooks to tests folder?
; notebooks/agent2.ipynb
; notebooks/colab-animate.ipynb
# TODO https://github.com/flatland-association/flatland-rl/issues/132 run rllib_demo as slow or make ml subfolder?
; notebooks/rllib_demo.ipynb
; notebooks/scene_editor.ipynb
; notebooks/simple_animation_demo.ipynb
; notebooks/simple_animation_demo_2.ipynb
; notebooks/simple_env_creation.ipynb
; notebooks/test-service-timeouts.ipynb

[testenv:py{3.10,3.11,3.12,3.13,3.14}-notebooks-no-pickle]
platform = linux|linux2|darwin
set_env =
    {[testenv]set_env}
    USE_PICKLE = false
allowlist_externals =
    bash
    pwd
deps =
    -r requirements-dev.txt
commands =
    python --version
    python -m pytest -s --nbmake notebooks/test_service.ipynb

[testenv:build]
base_python = python3.14
skip_install = true
# tox only forwards env vars listed here (plus its small built-in default set) - without this,
# SETUPTOOLS_SCM_PRETEND_VERSION set by the caller (see publish.yml's publish-test-pypi job) is silently
# dropped, and setuptools_scm falls back to a git-derived dev version with a local (+g<hash>) part, which
# PyPI/Test PyPI reject.
pass_env =
    SETUPTOOLS_SCM_PRETEND_VERSION
deps =
    -r requirements-dev.txt
commands =
    # sdist only, deliberately no wheel: cython is a [build-system] requires entry (pyproject.toml), so any
    # wheel built here would auto-compile the ext-modules whenever a C compiler is present (e.g. on this
    # runner) - but a wheel's platform/ABI tag is determined by whether Cython ever *attempted* to cythonize
    # the sources, not by whether the final compile succeeded (verified: a wheel built with Cython present but
    # the compiler faked missing still gets tagged e.g. cp313-cp313-linux_aarch64, not the universal
    # py2.py3-none-any one). Publishing such a wheel would make every other Python version/OS get NO matching
    # wheel at all. An sdist has no such tag (it's always just source), so publishing sdist-only sidesteps
    # this entirely: every install builds from source on the user's own machine, correctly compiling
    # automatically if they have Cython+a compiler and falling back gracefully (optional = true) if not - see
    # README.md's "Cython-accelerated build" section for the user-facing version of this.
    python -m build --sdist

# There is deliberately no verify-build-no-cython env: cython is a [build-system] requires entry, so
# `python -m build` - isolated or not, per PEP 517/518 - always mandates it be satisfiable in whichever
# environment is doing the build, and fails outright ("ERROR Missing dependencies: cython>=3.2.9") rather than
# falling back if it's absent. `optional = true` on each ext-modules entry (pyproject.toml) only ever covers a
# *compiler* failure gracefully (see verify-build-no-gcc below) - Cython itself genuinely missing is no longer
# a reachable, gracefully-degrading state for any PEP 517-compliant build tool.
[testenv:verify-build-no-gcc]
base_python = python3.14
skip_install = true
allowlist_externals =
    env
deps =
    -r requirements-dev.txt
    setuptools>=74.1.0
    setuptools_scm>=8
commands =
    # Cython is installed but no working C compiler is: build_ext must skip the optional extensions
    # with a warning rather than failing the whole build. Scope the bogus compiler to just this one
    # command (not via set_env, which would also break installing the deps above - e.g. numpy building
    # from source via meson needs a real compiler).
    env CC=/nonexistent-cc CXX=/nonexistent-cxx python -m build --no-isolation --wheel --outdir {envtmpdir}/dist
    python scripts/verify_cython_extension_build.py --dist-dir {envtmpdir}/dist --expect pure-python

[testenv:py{3.10,3.11,3.12,3.13,3.14}-verify-cython-build]
skip_install = true
deps =
    build
commands =
    python --version
    # plain isolated build, no special flags: cython auto-provisions via [build-system] requires, and with a
    # C compiler available (e.g. this runner's), the ext-modules must actually be compiled by default now,
    # not silently skipped.
    python -m build --wheel --outdir {envtmpdir}/dist
    python scripts/verify_cython_extension_build.py --dist-dir {envtmpdir}/dist --expect compiled

[testenv:py{3.10,3.11,3.12,3.13,3.14}-verify-cython-build-no-isolation]
skip_install = true
allowlist_externals =
    bash
deps =
    -r requirements-dev.txt
    setuptools>=74.1.0
    setuptools_scm>=8
commands =
    python --version
    # mirrors the README's `pip install --no-build-isolation -e .` local-dev path: with Cython and a C
    # compiler available in the current env (not the isolated build venv), the ext-modules must still compile.
    python -m build --no-isolation --wheel --outdir {envtmpdir}/dist
    python scripts/verify_cython_extension_build.py --dist-dir {envtmpdir}/dist --expect compiled
    # the wheel-content check above only proves the ext-modules got cythonized into a distributable artifact -
    # it never imports or calls them, so a .pxd/.py mismatch that compiles cleanly but breaks at runtime (e.g.
    # a cdef class field only ever assigned in the .py source, never declared in the .pxd - see the
    # "cython_ext" pytest marker in pyproject.toml) sails through undetected. Build in-place instead (the .so
    # lands right next to its .py, which Python's import machinery then prefers over the source) and run just
    # the tests marked cython_ext against it - a fast, targeted subset, not the full suite.
    python -c "from setuptools import setup; setup()" build_ext --inplace
    python -m pytest --ignore=tests/ml -m cython_ext
    bash -c "rm -rf build && find flatland \( -name '*.c' -o -name '*.so' \) -print0 | xargs -0 rm -f"

[testenv:py{3.10,3.11,3.12,3.13,3.14}-verify-install]
# install flatland-rl without additional dependencies
skip_install = false
commands =
    python --version
    python -c 'from flatland.evaluators.service import FlatlandRemoteEvaluationService'
    python -c 'import flatland.integrations.interactiveai.interactiveai'
    evaluator --help
    flatland-demo --help
    flatland-evaluator --help
    flatland-trajectory-evaluate --help
    flatland-trajectory-generate-from-policy --help
    flatland-trajectory-generate-from-metadata --help
    flatland-trajectory-analysis --help

[testenv:py{3.10,3.11,3.12,3.13,3.14}-verify-requirements]
skip_install = true
deps =
    -r requirements-dev.txt
    -r requirements-ml.txt
set_env =
    {[testenv]set_env}
    PINNED_AND_DYNAMICALLY_LOADED_MODULES="cachetools|dm-tree|wandb|contourpy|scipy|rpds-py"
    DEV_MODULES="coverage|deptry|flake8|flake8-eradicate|jupyter|jupyter-core|nbmake|notebook|pip-tools|pytest|pytest-retry|tox|tox-current-env|testcontainers|pytest-xdist|cython"
commands =
    python --version

    # convert notebooks for deptry as deptry parser seems to be buggy ("SyntaxError: Expected a statement at byte range...)
    python -m jupyter nbconvert --ExecutePreprocessor.timeout=1800 --to python  benchmarks/*.ipynb
    python -m jupyter nbconvert --ExecutePreprocessor.timeout=1800 --to python  notebooks/*.ipynb

    # N.B. we allow for modules directly imported to be transitive dependencies: --ignore DEP003

    # requirements.txt covers the core library without flatland/ml
    deptry . --verbose --ignore DEP003 --pep621-dev-dependency-groups dev,ml -ee flatland/ml -ee tests -ee benchmarks -ee notebooks -ee examples --per-rule-ignores "DEP002={env:PINNED_AND_DYNAMICALLY_LOADED_MODULES}|{env:DEV_MODULES}"

    # requirements-ml.txt covers the core library incl. flatland/ml
    deptry . --ignore DEP003 --pep621-dev-dependency-groups dev -ee tests -ee benchmarks -ee notebooks -ee examples --per-rule-ignores "DEP002={env:PINNED_AND_DYNAMICALLY_LOADED_MODULES}|{env:DEV_MODULES}"

    # requirements-dev.txt covers everything except flatland/ml and tests/ml
    deptry . --ignore DEP003 --pep621-dev-dependency-groups ml -ee flatland/ml -ee tests/ml -ee "notebooks/rllib_demo.*" --per-rule-ignores "DEP002={env:PINNED_AND_DYNAMICALLY_LOADED_MODULES}|{env:DEV_MODULES}"

    # requirements-dev.txt + requirements-ml.txt covers everything:
    deptry . --ignore DEP003 --per-rule-ignores "DEP002={env:PINNED_AND_DYNAMICALLY_LOADED_MODULES}|{env:DEV_MODULES}"


[testenv:py{3.10,3.11,3.12,3.13,3.14}-benchmarks]
platform = linux|linux2|darwin
deps =
    -r requirements-dev.txt
set_env =
    {[testenv]set_env}
    BENCHMARK_EPISODES_FOLDER = {tox_root}/episodes
commands =
    python --version
    python -m cProfile -o benchmarks.hprof {work_dir}/{env_name}/bin/py.test  benchmarks/benchmark_episodes.py
