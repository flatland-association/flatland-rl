name: Checks

env:
    flatland-benchmarks-episodes-url: "https://github.com/flatland-association/flatland-scenarios/raw/refs/heads/178-agents-living-on-the-edge-9/trajectories/FLATLAND_BENCHMARK_EPISODES_FOLDER_v7.zip"
    flatland-scenarios-olten-partially-closed-url: "https://github.com/flatland-association/flatland-scenarios/raw/refs/heads/main/scenario_olten/data/OLTEN_PARTIALLY_CLOSED_v2.zip"
    ecml2026-pkl: "https://github.com/flatland-association/ecml2026-starterkit/raw/refs/heads/main/reinforcement_learning/sampling/level_0_scenario_1.pkl"
    ecml2026-stations-pkl: "https://github.com/flatland-association/ecml2026-starterkit/raw/refs/heads/main/reinforcement_learning/sampling/stations.pkl"
    # single source of truth for which matrix leg of the profiling/profiling-get-k-shortest-paths jobs
    # publishes to the gist/PR comment - see those jobs for why it's 3.13, not the latest (3.14) or 3.12
    profiling-python-version: "3.13"

on:
    workflow_dispatch:
        inputs:
            run_benchmarks:
                type: boolean
    pull_request:
    push:
        branches: [ "main" ]
    schedule:
        -   cron: '30 5 * * *'
concurrency:
    group: ${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        # Disabled for now, hasn't run in a while resulting in countless issues. Gated on a repo/org Actions
        # variable (Settings > Secrets and variables > Actions > Variables) rather than a literal `if: false`:
        # `env` isn't available in job-level `if:` conditions (only resolved once the job starts), and
        # actionlint's if-cond rule flags a literal boolean constant as dead code to be removed outright.
        # Unset (the default) evaluates to empty string, i.e. still disabled - set LINT_ENABLED=true to re-enable.
        if: ${{ vars.LINT_ENABLED == 'true' }}
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@v6
            -   name: Set up Python
                uses: actions/setup-python@v6
                with:
                    python-version: "3.14"
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install tox tox-gh-actions
            -   name: Run lint checks
                run: tox run -e flake8

    actionlint:
        # Static analysis of .github/workflows/*.yml itself - catches invalid expressions/`if:` typos and
        # (via its shellcheck integration) `run:` steps that interpolate untrusted `${{ }}` input directly
        # into shell instead of routing it through `env:`, the exact script-injection shape fixed in publish.yml.
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@v6
            -   name: Download actionlint
                id: get_actionlint
                run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
                shell: bash
            -   name: Run actionlint
                run: ${{ steps.get_actionlint.outputs.executable }} -color
                shell: bash

    # Builds/pushes the CI-only dependency image consumed by the deptry/testml jobs below (see
    # Dockerfile.ci-env, a separate, non-user-facing image from the ones docker.yml/publish.yml build and
    # publish to end users). See build-ci-env.yml (shared with publish.yml's own pre-release test job) for
    # the actual build/cache-check/push logic and why GHCR was chosen over actions/cache for this.
    build-ci-env-ml:
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        uses: ./.github/workflows/build-ci-env.yml
        with:
            python-version: ${{ matrix.python-version }}
            with-ml: true

    # Leaner counterpart to build-ci-env-ml, consumed by the test/examples jobs below: no
    # requirements-ml.txt, no dm-tree/cmake, since neither ever installs it.
    build-ci-env-default:
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        uses: ./.github/workflows/build-ci-env.yml
        with:
            python-version: ${{ matrix.python-version }}
            with-ml: false

    deptry:
        needs: [ build-ci-env-ml ]
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: read
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        # All requirements-dev.txt/requirements-ml.txt deps (incl. scipy/dm-tree, already built from source)
        # are baked into this image by build-ci-env-ml above - nothing left to install here.
        container:
            # Matches build-ci-env-ml's tag exactly (see build-ci-env.yml for why it's keyed on a content
            # hash, not just Python-version). Read via needs.*.outputs rather than computing
            # hashFiles() here directly: container: is resolved before this job's own checkout runs, so
            # hashFiles() would see no files yet - needs.*.outputs works because it's just a stored value
            # from the already-completed build-ci-env-ml job, not a live filesystem read.
            image: ghcr.io/${{ github.repository }}-ci-env:py${{ matrix.python-version }}-ml-${{ needs.build-ci-env-ml.outputs.image-hash }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
        steps:
            -   uses: actions/checkout@v6
            # Runs tox.ini's own [testenv:py{...}-verify-requirements] against this image's already-installed
            # packages: --current-env (tox-current-env, a requirements-dev.txt dependency) skips venv
            # creation/dependency install, but still applies tox.ini's set_env and runs its exact commands -
            # so the actual deptry invocation lives in exactly one place (tox.ini), not two.
            -   name: Run deptry
                run: tox run -e py${{ matrix.python-version }}-verify-requirements --current-env

    testml:
        needs: [ build-ci-env-ml ]
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: read
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        # All requirements-dev.txt/requirements-ml.txt deps (incl. scipy/dm-tree, already built from source)
        # are baked into this image by build-ci-env-ml above - nothing left to install here.
        container:
            # Matches build-ci-env-ml's tag exactly (see build-ci-env.yml for why it's keyed on a content
            # hash, not just Python-version). Read via needs.*.outputs rather than computing
            # hashFiles() here directly: container: is resolved before this job's own checkout runs, so
            # hashFiles() would see no files yet - needs.*.outputs works because it's just a stored value
            # from the already-completed build-ci-env-ml job, not a live filesystem read.
            image: ghcr.io/${{ github.repository }}-ci-env:py${{ matrix.python-version }}-ml-${{ needs.build-ci-env-ml.outputs.image-hash }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
        steps:
            -   uses: actions/checkout@v6
            # The archive is versioned in its URL, so a plain URL-keyed cache is safe indefinitely -
            # no invalidation is needed until the workflow itself is updated to a new URL.
            -   name: Restore cached episodes
                id: cache-episodes
                uses: actions/cache/restore@v5
                with:
                    path: episodes
                    key: episodes-${{ env.flatland-benchmarks-episodes-url }}
            -   name: Download episodes
                if: steps.cache-episodes.outputs.cache-hit != 'true'
                run: |
                    wget "${{ env.flatland-benchmarks-episodes-url }}" -O FLATLAND_BENCHMARK_EPISODES_FOLDER.zip
                    mkdir -p episodes
                    unzip -o FLATLAND_BENCHMARK_EPISODES_FOLDER -d episodes
            -   name: Save cached episodes
                if: ${{ always() && steps.cache-episodes.outputs.cache-hit != 'true' }}
                uses: actions/cache/save@v5
                with:
                    path: episodes
                    key: episodes-${{ env.flatland-benchmarks-episodes-url }}
            # Runs tox.ini's own [testenv:py{...}-ml] against this image's already-installed packages:
            # --current-env skips venv creation/dependency reinstall (which would rebuild scipy/dm-tree from
            # source again, defeating the point of this image) but still applies tox.ini's set_env
            # (including BENCHMARK_EPISODES_FOLDER/PYTHONPATH, both resolved portably via {tox_root}/
            # {toxinidir}) and runs its exact commands.
            -   name: Run tests
                run: tox run -e py${{ matrix.python-version }}-ml --current-env

    # See run-ci-env-test.yml (shared with publish.yml's own pre-release test job) for the actual test
    # invocation.
    test:
        needs: [ build-ci-env-default ]
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        uses: ./.github/workflows/run-ci-env-test.yml
        with:
            python-version: ${{ matrix.python-version }}
            image-hash: ${{ needs.build-ci-env-default.outputs.image-hash }}

    # Not containerized (unlike deptry/testml/test/examples above) despite using the same requirements-dev.txt
    # - blocked on this job's "Start Redis" services: container below, for two compounding reasons:
    #
    # 1. The simple fix - add `container: {image: ...}` and keep everything else as-is - doesn't work,
    #    because a containerized job's `container:` can't be given `--network host` to make it share the
    #    runner's own network namespace: GH's docs for `container:`/`services:` `options:` state plainly
    #    "The --network and --entrypoint options are not supported."
    #    https://docs.github.com/en/actions/using-jobs/running-jobs-in-a-container
    #
    # 2. Without --network host, GH Actions' actual supported mechanism for a containerized job to reach a
    #    services: container is different, not absent: it auto-joins the job's container and the service
    #    container to a shared Docker bridge network, reachable via the service's label as a hostname (e.g.
    #    `redis`), not via localhost/127.0.0.1 - see "About service containers":
    #    https://docs.github.com/en/actions/using-containerized-services/about-service-containers
    #    That's exactly the opposite of how it works today: this job runs directly on the runner (no
    #    container:), so Redis's port is published straight onto the runner's own localhost, which is
    #    exactly what notebooks/test_service.ipynb and notebooks/test-service-timeouts.ipynb hardcode
    #    (localhost/127.0.0.1). Containerizing without also editing those notebook cells to use the `redis`
    #    hostname would just trade one failure (no --network host) for another (wrong hostname).
    #
    # A fix does exist (parameterize the Redis host in the two notebooks, then add `container:` + keep
    # `services:` here), but this job deliberately keeps its current tox+actions/cache setup instead of
    # pursuing it:
    # - Unlike deptry/testml/test/examples, this job's slowness isn't dominated by rebuilding scipy/dm-tree
    #   from source - that's what the GHCR image caching elsewhere in this file targets - so containerizing
    #   it wouldn't recover anywhere near the same payoff for the added complexity (a new/adapted CI-env
    #   image variant, plus wiring notebooks into build-ci-env.yml/run-ci-env-test.yml).
    # - notebooks/test_service.ipynb and notebooks/test-service-timeouts.ipynb are read and run
    #   interactively by humans, not just executed by CI - hardcoding a `redis` hostname instead of
    #   localhost/127.0.0.1 to satisfy the containerized-job networking model would be a behavior change for
    #   that interactive use too, not a CI-only config tweak, which is out of scope for a CI-time-reduction
    #   effort.
    # - This job already carves out python-version 3.10 as "failing too often" (see the matrix below) - it's
    #   an already-accepted soft spot in this workflow, not the main bottleneck this effort was aimed at.
    notebooks:
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                python-version: [
                  # "3.10", # commented out as failing too often
                    "3.11", "3.12", "3.13", "3.14" ]
        steps:
            -   uses: actions/checkout@v6
            -   name: Install ffmpeg
                run: |
                    set -euxo pipefail
                    # https://askubuntu.com/questions/1512042/ubuntu-24-04-getting-error-you-must-put-some-deb-src-uris-in-your-sources-list
                    sudo sed -i 's/^Types: deb/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
                    sudo apt-get update
                    sudo apt-get -y install ffmpeg
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v6
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Start Redis
                uses: supercharge/redis-github-action@1.8.1
                with:
                    redis-version: 7.4.2
                    redis-port: 6379
            # https://adamj.eu/tech/2023/11/02/github-actions-faster-python-virtual-environments/ - skipped on
            # scheduled runs so the nightly cron always exercises a from-scratch install.
            -   name: Restore cached tox environments
                if: ${{ github.event_name != 'schedule' }}
                uses: actions/cache/restore@v5
                with:
                    path: .tox
                    key: tox-notebooks-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt') }}
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install -U tox tox-gh-actions
            -   name: Run notebooks
                run: |
                    tox run -e py${{ matrix.python-version }}-notebooks
                    tox run -e py${{ matrix.python-version }}-notebooks-no-pickle
            -   name: Save cached tox environments
                if: ${{ always() && github.event_name != 'schedule' }}
                uses: actions/cache/save@v5
                with:
                    path: .tox
                    key: tox-notebooks-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt') }}

    examples:
        needs: [ build-ci-env-default ]
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: read
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        # requirements-dev.txt (incl. scipy, already built from source) is baked into this image by
        # build-ci-env-default above - nothing left to install here. Same image as test (no Redis/other
        # service dependency here, so no networking wrinkle - see notebooks, which does have one and isn't
        # containerized yet for that reason).
        container:
            image: ghcr.io/${{ github.repository }}-ci-env:py${{ matrix.python-version }}-default-${{ needs.build-ci-env-default.outputs.image-hash }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
        steps:
            -   uses: actions/checkout@v6
            -   name: Download Olten scenario
                run: |
                    wget "${{ env.flatland-scenarios-olten-partially-closed-url }}" -O OLTEN_PARTIALLY_CLOSED_v2.zip
                    mkdir -p scenarios/scenario_olten/data
                    unzip -o OLTEN_PARTIALLY_CLOSED_v2 -d scenarios/scenario_olten/data
            # Runs tox.ini's own [testenv:py{...}-examples] against this image's already-installed packages:
            # --current-env skips venv creation/dependency reinstall (which would rebuild scipy from source
            # again, defeating the point of this image) but still applies tox.ini's set_env (including
            # SCENARIOS_FOLDER/PYTHONPATH, resolved portably via {tox_root}/{toxinidir}) and runs its exact
            # commands.
            -   name: Run examples
                run: tox run -e py${{ matrix.python-version }}-examples --current-env

    verify-cython-build:
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        steps:
            -   uses: actions/checkout@v6
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v6
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install tox tox-gh-actions
            -   name: Verify Cython modules are compiled when Cython and gcc are available (default isolated build)
                run: tox run -e py${{ matrix.python-version }}-verify-cython-build
            -   name: Verify Cython modules are compiled when Cython and gcc are available (--no-build-isolation)
                run: tox run -e py${{ matrix.python-version }}-verify-cython-build-no-isolation

    verify-build-fallback:
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@v6
            -   name: Set up Python
                uses: actions/setup-python@v6
                with:
                    python-version: "3.14"
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install tox tox-gh-actions
            -   name: Verify build succeeds without a C compiler
                run: tox run -e verify-build-no-gcc

    build:
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@v6
            -   name: Set up Python
                uses: actions/setup-python@v6
                with:
                    python-version: "3.14"
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install tox tox-gh-actions
            -   name: Build package
                run: tox run -e build
            -   name: Verify dist is a pure-Python sdist (no wheel)
                run: python scripts/verify_cython_extension_build.py --dist-dir dist --artifact sdist --expect pure-python

    profiling:
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            pull-requests: write
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        steps:
            -   uses: actions/checkout@v6
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v6
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Download Olten scenario
                run: |
                    wget "${{ env.flatland-scenarios-olten-partially-closed-url }}" -O OLTEN_PARTIALLY_CLOSED_v2.zip
                    mkdir -p scenarios/scenario_olten/data
                    unzip -o OLTEN_PARTIALLY_CLOSED_v2 -d scenarios/scenario_olten/data
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install -U tox tox-gh-actions
            # No .tox caching here (unlike the other jobs): this env's profiling output is written under
            # .tox/py${{ matrix.python-version }}-profiling/log, i.e. inside the directory that would be
            # cached - caching it risks uploading a stale profiling log as if it were the current run's.
            -   name: Run profiling
                run: tox run -e py${{ matrix.python-version }}-profiling
            -   uses: actions/upload-artifact@v6
                with:
                    name: upload-profiling-results-${{ matrix.python-version }}
                    path: .tox/py${{ matrix.python-version }}-profiling/log
                    if-no-files-found: error
            -   uses: actions/upload-artifact@v6
                with:
                    name: upload-performance-profiling-results-${{ matrix.python-version }}
                    path: |
                        benchmarks/*.prof
                        benchmarks/*.png
                    if-no-files-found: error
            # Only the env.profiling-python-version leg publishes to a gist and comments on the PR - no need
            # to repeat the same picture for every matrix entry. Restricted to same-repo PRs since forks
            # don't receive secrets (GIST_TOKEN), so the gist/comment step would just fail auth on a fork PR.
            #
            # NOT 3.12: cProfile can't see calls into compiled Cython functions on Python 3.12 at all (not
            # zero-time, just absent from the stats) - confirmed against cython/cython#5470: Python 3.12
            # moved cProfile onto PEP 669's sys.monitoring, and Cython's own sys.monitoring bridge
            # (CYTHON_USE_SYS_MONITORING) is gated to PY_VERSION_HEX >= 0x030d00b1, i.e. Python 3.13+ only -
            # verified empirically that this is unaffected by the Cython version (reproduced identically with
            # both the pinned cython==3.2.9 and the previously-pinned 3.3.0a1; only the Python version
            # matters). Python 3.13 is the first version where get_k_shortest_paths (and any other
            # @cython.profile(True) function) actually shows up in the .prof output.
            -   name: Report overall profiling result
                if: >-
                    ${{ github.event_name == 'pull_request' && matrix.python-version == env.profiling-python-version &&
                    github.event.pull_request.head.repo.full_name == github.repository }}
                uses: ./.github/actions/profiling-comment
                with:
                    comment-marker: flatland-ci-profiling-overall
                    title: "Performance profiling (Python ${{ env.profiling-python-version }})"
                    image-alt: "performance overall"
                    png-path: benchmarks/performance_overall.png
                    gist-filename-suffix: performance_overall.png
                    gist-token: ${{ secrets.GIST_TOKEN }}

    profiling-get-k-shortest-paths:
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            pull-requests: write
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        steps:
            -   uses: actions/checkout@v6
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v6
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Download ecml2026 scenario
                run: |
                    wget "${{ env.ecml2026-pkl }}" -O level_0_scenario_1.pkl
                    wget "${{ env.ecml2026-stations-pkl }}" -O stations.pkl
                working-directory: ${{ github.workspace }}
            # https://adamj.eu/tech/2023/11/02/github-actions-faster-python-virtual-environments/ - skipped on
            # scheduled runs so the nightly cron always exercises a from-scratch install.
            -   name: Restore cached tox environments
                if: ${{ github.event_name != 'schedule' }}
                uses: actions/cache/restore@v5
                with:
                    path: .tox
                    key: tox-profiling-get-k-shortest-paths-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt') }}
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install -U tox tox-gh-actions
            -   name: Run profiling
                run: tox run -e py${{ matrix.python-version }}-profiling-get-k-shortest-paths
            -   name: Save cached tox environments
                if: ${{ always() && github.event_name != 'schedule' }}
                uses: actions/cache/save@v5
                with:
                    path: .tox
                    key: tox-profiling-get-k-shortest-paths-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt') }}
            -   uses: actions/upload-artifact@v6
                with:
                    name: upload-profiling-get-k-shortest-paths-results-${{ matrix.python-version }}
                    path: |
                        benchmarks/*.prof
                        benchmarks/*.png
                    if-no-files-found: error
            # See the `profiling` job above for why this is gated to env.profiling-python-version (not 3.12)
            # and same-repo PRs only - cProfile can't see compiled Cython calls on 3.12 (cython/cython#5470).
            -   name: Report get_k_shortest_paths profiling result
                if: >-
                    ${{ github.event_name == 'pull_request' && matrix.python-version == env.profiling-python-version &&
                    github.event.pull_request.head.repo.full_name == github.repository }}
                uses: ./.github/actions/profiling-comment
                with:
                    comment-marker: flatland-ci-profiling-get-k-shortest-paths
                    title: "`get_k_shortest_paths` profiling (Python ${{ env.profiling-python-version }})"
                    image-alt: "get_k_shortest_paths profiling"
                    png-path: benchmarks/performance_get_k_shortest_paths.png
                    gist-filename-suffix: performance_get_k_shortest_paths.png
                    gist-token: ${{ secrets.GIST_TOKEN }}

    benchmarks:
        if: ${{ github.event.inputs.run_benchmarks || github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        steps:
            -   uses: actions/checkout@v6
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v6
                with:
                    python-version: ${{ matrix.python-version }}
            # The archive is versioned in its URL, so a plain URL-keyed cache is safe indefinitely -
            # no invalidation is needed until the workflow itself is updated to a new URL.
            -   name: Restore cached episodes
                id: cache-episodes
                uses: actions/cache/restore@v5
                with:
                    path: episodes
                    key: episodes-${{ env.flatland-benchmarks-episodes-url }}
            -   name: Download episodes
                if: steps.cache-episodes.outputs.cache-hit != 'true'
                run: |
                    wget "${{ env.flatland-benchmarks-episodes-url }}" -O FLATLAND_BENCHMARK_EPISODES_FOLDER.zip
                    mkdir -p episodes
                    unzip -o FLATLAND_BENCHMARK_EPISODES_FOLDER -d episodes
                working-directory: ${{ github.workspace }}
            -   name: Save cached episodes
                if: ${{ always() && steps.cache-episodes.outputs.cache-hit != 'true' }}
                uses: actions/cache/save@v5
                with:
                    path: episodes
                    key: episodes-${{ env.flatland-benchmarks-episodes-url }}
            -   name: Download ecml2026 scenario
                run: wget "${{ env.ecml2026-pkl }}" -O level_0_scenario_1.pkl
                working-directory: ${{ github.workspace }}
            # https://adamj.eu/tech/2023/11/02/github-actions-faster-python-virtual-environments/ - skipped on
            # scheduled runs so the nightly cron always exercises a from-scratch install.
            -   name: Restore cached tox environments
                if: ${{ github.event_name != 'schedule' }}
                uses: actions/cache/restore@v5
                with:
                    path: .tox
                    key: tox-benchmarks-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt') }}
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install -U tox tox-gh-actions
            -   name: Run benchmarks
                run: tox run -e py${{ matrix.python-version }}-benchmarks
            -   name: Save cached tox environments
                if: ${{ always() && github.event_name != 'schedule' }}
                uses: actions/cache/save@v5
                with:
                    path: .tox
                    key: tox-benchmarks-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt') }}
            -   uses: actions/upload-artifact@v6
                with:
                    name: upload-benchmarks-results-${{ matrix.python-version }}
                    path: benchmarks.hprof
                    if-no-files-found: error
