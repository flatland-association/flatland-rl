name: Checks

env:
    flatland-benchmarks-episodes-url: "https://github.com/flatland-association/flatland-scenarios/raw/refs/heads/main/trajectories/FLATLAND_BENCHMARK_EPISODES_FOLDER_v5.zip"
    flatland-scenarios-olten-partially-closed-url: "https://github.com/flatland-association/flatland-scenarios/raw/refs/heads/main/scenario_olten/data/OLTEN_PARTIALLY_CLOSED_v2.zip"
    ecml2026-pkl: "https://github.com/flatland-association/ecml2026-starterkit/raw/refs/heads/main/reinforcement_learning/sampling/level_0_scenario_1.pkl"
    ecml2026-stations-pkl: "https://github.com/flatland-association/ecml2026-starterkit/raw/refs/heads/main/reinforcement_learning/sampling/stations.pkl"
    # single source of truth for which matrix leg of the profiling/profiling-get-k-shortest-paths jobs
    # publishes to the gist/PR comment - see those jobs for why it's 3.13, not the latest (3.14) or 3.12
    profiling-python-version: "3.13"

on:
    workflow_dispatch:
        inputs:
            run_benchmarks:
                type: boolean
    pull_request:
    push:
        branches: [ "main" ]
    schedule:
        -   cron: '30 5 * * *'
concurrency:
    group: ${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        # Disabled for now, hasn't run in a while resulting in countless issues. Gated on a repo/org Actions
        # variable (Settings > Secrets and variables > Actions > Variables) rather than a literal `if: false`:
        # `env` isn't available in job-level `if:` conditions (only resolved once the job starts), and
        # actionlint's if-cond rule flags a literal boolean constant as dead code to be removed outright.
        # Unset (the default) evaluates to empty string, i.e. still disabled - set LINT_ENABLED=true to re-enable.
        if: ${{ vars.LINT_ENABLED == 'true' }}
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@v6
            -   name: Set up Python
                uses: actions/setup-python@v6
                with:
                    python-version: "3.14"
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install tox tox-gh-actions
            -   name: Run lint checks
                run: tox run -e flake8

    actionlint:
        # Static analysis of .github/workflows/*.yml itself - catches invalid expressions/`if:` typos and
        # (via its shellcheck integration) `run:` steps that interpolate untrusted `${{ }}` input directly
        # into shell instead of routing it through `env:`, the exact script-injection shape fixed in publish.yml.
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@v6
            -   name: Download actionlint
                id: get_actionlint
                run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
                shell: bash
            -   name: Run actionlint
                run: ${{ steps.get_actionlint.outputs.executable }} -color
                shell: bash

    deptry:
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        # dm-tree's vendored abseil-cpp (20210324.2) fails to compile with GCC 13+ (the runner's default);
        # gcc-12/g++-12 (installed below) build it fine. tox passes CC/CXX through by default.
        env:
            CC: gcc-12
            CXX: g++-12
        steps:
            -   name: Inspect disk
                run: |
                    df -h
                    docker system df
            # https://stackoverflow.com/questions/30604846/docker-complains-about-no-space-left-on-device-how-to-clean-up
            -   name: Prune docker system
                run: |
                    docker system prune --all --force
            # https://www.dzombak.com/blog/2024/09/freeing-disk-space-on-github-actions-runners/
            -   name: Free disk space
                run: |
                    curl -fsSL https://raw.githubusercontent.com/kou/arrow/e49d8ae15583ceff03237571569099a6ad62be32/ci/scripts/util_free_space.sh | bash
            -   name: Inspect disk again
                run: |
                    df -h
                    docker system df
            -   name: Install ffmpeg
                run: |
                    set -euxo pipefail
                    sudo sed -i 's/^Types: deb/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
                    sudo apt-get update
                    sudo apt-get -y install ffmpeg
                    # TODO As long as scipy is pinned to < 1.16 (to ensure to support for Python 3.10), we need to install it from source
                    # https://docs.scipy.org/doc/scipy/building/index.html
                    sudo apt-get -y build-dep scipy
                    # scipy's build-dep pulls in an old pybind11-dev that meson picks up via pkg-config ahead of
                    # the newer pip-installed pybind11, breaking contourpy's from-source build on newer Pythons
                    sudo apt-get -y remove pybind11-dev || true
                    # dm-tree's vendored abseil-cpp (20210324.2) fails to compile with GCC 13+ (the runner's
                    # default); gcc-12/g++-12 build it fine. CC/CXX are set at job level below (tox passes them through by default).
                    sudo apt-get -y install gcc-12 g++-12
                    # scipy's meson build looks for OpenBLAS specifically via pkg-config; the generic BLAS/LAPACK
                    # virtual package satisfied by `build-dep scipy` doesn't necessarily provide openblas.pc.
                    sudo apt-get -y install libopenblas-dev
            -   uses: actions/checkout@v6
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v6
                with:
                    python-version: ${{ matrix.python-version }}
            # scipy/dm-tree build from source (see "Install ffmpeg" step above); cache pip's built wheels
            # so only a requirements bump triggers a recompile. Same key as the test/testml jobs below so
            # the cache is shared across all three. Skipped (read-only) on scheduled runs, like the .tox
            # cache below, so the nightly cron always exercises a from-scratch build - but nightly's
            # freshly-built wheels are still saved (see the Save step below), so PR/push runs benefit.
            -   name: Restore cached pip wheels
                if: ${{ github.event_name != 'schedule' }}
                uses: actions/cache/restore@v5
                with:
                    path: ~/.cache/pip
                    key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements-dev.txt', 'requirements-ml.txt') }}
            # https://adamj.eu/tech/2023/11/02/github-actions-faster-python-virtual-environments/ - skipped on
            # scheduled runs so the nightly cron always exercises a from-scratch install.
            -   name: Restore cached tox environments
                if: ${{ github.event_name != 'schedule' }}
                uses: actions/cache/restore@v5
                with:
                    path: .tox
                    key: tox-deptry-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt', 'requirements-ml.txt') }}
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install -U tox tox-gh-actions
            -   name: Run deptry
                run: tox -e py${{ matrix.python-version }}-verify-requirements
            -   name: Save cached pip wheels
                if: always()
                uses: actions/cache/save@v5
                with:
                    path: ~/.cache/pip
                    key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements-dev.txt', 'requirements-ml.txt') }}
            -   name: Save cached tox environments
                if: ${{ always() && github.event_name != 'schedule' }}
                uses: actions/cache/save@v5
                with:
                    path: .tox
                    key: tox-deptry-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt', 'requirements-ml.txt') }}

    testml:
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        # dm-tree's vendored abseil-cpp (20210324.2) fails to compile with GCC 13+ (the runner's default);
        # gcc-12/g++-12 (installed below) build it fine. tox passes CC/CXX through by default.
        env:
            CC: gcc-12
            CXX: g++-12
        steps:
            -   name: Inspect disk
                run: |
                    df -h
                    docker system df
            # https://stackoverflow.com/questions/30604846/docker-complains-about-no-space-left-on-device-how-to-clean-up
            -   name: Prune docker system
                run: |
                    docker system prune --all --force
            # https://www.dzombak.com/blog/2024/09/freeing-disk-space-on-github-actions-runners/
            -   name: Free disk space
                run: |
                    curl -fsSL https://raw.githubusercontent.com/kou/arrow/e49d8ae15583ceff03237571569099a6ad62be32/ci/scripts/util_free_space.sh | bash
            -   name: Inspect disk again
                run: |
                    df -h
                    docker system df
            -   name: Install ffmpeg
                run: |
                    set -euxo pipefail
                    # https://askubuntu.com/questions/1512042/ubuntu-24-04-getting-error-you-must-put-some-deb-src-uris-in-your-sources-list
                    sudo sed -i 's/^Types: deb/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
                    sudo apt-get update
                    sudo apt-get -y install ffmpeg
                    # TODO As long as scipy is pinned to < 1.16 (to ensure to support for Python 3.10), we need to install it from source
                    # https://docs.scipy.org/doc/scipy/building/index.html
                    sudo apt-get -y build-dep scipy
                    # scipy's build-dep pulls in an old pybind11-dev that meson picks up via pkg-config ahead of
                    # the newer pip-installed pybind11, breaking contourpy's from-source build on newer Pythons
                    sudo apt-get -y remove pybind11-dev || true
                    # dm-tree's vendored abseil-cpp (20210324.2) fails to compile with GCC 13+ (the runner's
                    # default); gcc-12/g++-12 build it fine. CC/CXX are set at job level below (tox passes them through by default).
                    sudo apt-get -y install gcc-12 g++-12
                    # scipy's meson build looks for OpenBLAS specifically via pkg-config; the generic BLAS/LAPACK
                    # virtual package satisfied by `build-dep scipy` doesn't necessarily provide openblas.pc.
                    sudo apt-get -y install libopenblas-dev
            -   uses: actions/checkout@v6
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v6
                with:
                    python-version: ${{ matrix.python-version }}
            # scipy/dm-tree build from source (see "Install ffmpeg" step above); cache pip's built wheels
            # so only a requirements bump triggers a recompile. Same key as the deptry/test jobs so the
            # cache is shared across all three. Skipped (read-only) on scheduled runs, like the .tox cache
            # below, so the nightly cron always exercises a from-scratch build - but nightly's freshly-built
            # wheels are still saved (see the Save step below), so PR/push runs benefit.
            -   name: Restore cached pip wheels
                if: ${{ github.event_name != 'schedule' }}
                uses: actions/cache/restore@v5
                with:
                    path: ~/.cache/pip
                    key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements-dev.txt', 'requirements-ml.txt') }}
            # The archive is versioned in its URL (v5), so a plain URL-keyed cache is safe indefinitely -
            # no invalidation is needed until the workflow itself is updated to a new URL.
            -   name: Restore cached episodes
                id: cache-episodes
                uses: actions/cache/restore@v5
                with:
                    path: episodes
                    key: episodes-${{ env.flatland-benchmarks-episodes-url }}
            -   name: Download episodes
                if: steps.cache-episodes.outputs.cache-hit != 'true'
                run: |
                    wget "${{ env.flatland-benchmarks-episodes-url }}" -O FLATLAND_BENCHMARK_EPISODES_FOLDER.zip
                    mkdir -p episodes
                    unzip FLATLAND_BENCHMARK_EPISODES_FOLDER -d episodes
            -   name: Save cached episodes
                if: ${{ always() && steps.cache-episodes.outputs.cache-hit != 'true' }}
                uses: actions/cache/save@v5
                with:
                    path: episodes
                    key: episodes-${{ env.flatland-benchmarks-episodes-url }}
            # https://adamj.eu/tech/2023/11/02/github-actions-faster-python-virtual-environments/ - skipped on
            # scheduled runs so the nightly cron always exercises a from-scratch install.
            -   name: Restore cached tox environments
                if: ${{ github.event_name != 'schedule' }}
                uses: actions/cache/restore@v5
                with:
                    path: .tox
                    key: tox-testml-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt', 'requirements-ml.txt') }}
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install -U tox tox-gh-actions
            -   name: Run tests
                run: tox run -e py${{ matrix.python-version }}-ml
            -   name: Save cached pip wheels
                if: always()
                uses: actions/cache/save@v5
                with:
                    path: ~/.cache/pip
                    key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements-dev.txt', 'requirements-ml.txt') }}
            -   name: Save cached tox environments
                if: ${{ always() && github.event_name != 'schedule' }}
                uses: actions/cache/save@v5
                with:
                    path: .tox
                    key: tox-testml-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt', 'requirements-ml.txt') }}
            -   name: Check disk space
                run: df . -h

    test:
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        steps:
            -   name: Inspect disk
                run: |
                    df -h
                    docker system df
            # https://stackoverflow.com/questions/30604846/docker-complains-about-no-space-left-on-device-how-to-clean-up
            -   name: Prune docker system
                run: |
                    docker system prune --all --force
            # https://www.dzombak.com/blog/2024/09/freeing-disk-space-on-github-actions-runners/
            -   name: Free disk space
                run: |
                    curl -fsSL https://raw.githubusercontent.com/kou/arrow/e49d8ae15583ceff03237571569099a6ad62be32/ci/scripts/util_free_space.sh | bash
            -   name: Inspect disk again
                run: |
                    df -h
                    docker system df
            -   name: Install ffmpeg
                run: |
                    set -euxo pipefail
                    # https://askubuntu.com/questions/1512042/ubuntu-24-04-getting-error-you-must-put-some-deb-src-uris-in-your-sources-list
                    sudo sed -i 's/^Types: deb/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
                    sudo apt-get update
                    sudo apt-get -y install ffmpeg

            -   uses: actions/checkout@v6
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v6
                with:
                    python-version: ${{ matrix.python-version }}
            # scipy builds from source (see "Install ffmpeg" step above); cache pip's built wheels so only
            # a requirements bump triggers a recompile. Same key as the deptry/testml jobs (even though
            # this job doesn't install requirements-ml.txt) so the cache is shared across all three.
            # Skipped (read-only) on scheduled runs, like the .tox cache below, so the nightly cron always
            # exercises a from-scratch build - but nightly's freshly-built wheels are still saved (see the
            # Save step below), so PR/push runs benefit.
            -   name: Restore cached pip wheels
                if: ${{ github.event_name != 'schedule' }}
                uses: actions/cache/restore@v5
                with:
                    path: ~/.cache/pip
                    key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements-dev.txt', 'requirements-ml.txt') }}
            # The archive is versioned in its URL (v5), so a plain URL-keyed cache is safe indefinitely -
            # no invalidation is needed until the workflow itself is updated to a new URL.
            -   name: Restore cached episodes
                id: cache-episodes
                uses: actions/cache/restore@v5
                with:
                    path: episodes
                    key: episodes-${{ env.flatland-benchmarks-episodes-url }}
            -   name: Download episodes
                if: steps.cache-episodes.outputs.cache-hit != 'true'
                run: |
                    wget "${{ env.flatland-benchmarks-episodes-url }}" -O FLATLAND_BENCHMARK_EPISODES_FOLDER.zip
                    mkdir -p episodes
                    unzip FLATLAND_BENCHMARK_EPISODES_FOLDER -d episodes
            -   name: Save cached episodes
                if: ${{ always() && steps.cache-episodes.outputs.cache-hit != 'true' }}
                uses: actions/cache/save@v5
                with:
                    path: episodes
                    key: episodes-${{ env.flatland-benchmarks-episodes-url }}
            # https://adamj.eu/tech/2023/11/02/github-actions-faster-python-virtual-environments/ - skipped on
            # scheduled runs so the nightly cron always exercises a from-scratch install.
            -   name: Restore cached tox environments
                if: ${{ github.event_name != 'schedule' }}
                uses: actions/cache/restore@v5
                with:
                    path: .tox
                    key: tox-test-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt') }}
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install -U tox tox-gh-actions
            -   name: Run tests
                run: tox -e py${{ matrix.python-version }},py${{ matrix.python-version }}-verify-install
            -   name: Save cached pip wheels
                if: always()
                uses: actions/cache/save@v5
                with:
                    path: ~/.cache/pip
                    key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements-dev.txt', 'requirements-ml.txt') }}
            -   name: Save cached tox environments
                if: ${{ always() && github.event_name != 'schedule' }}
                uses: actions/cache/save@v5
                with:
                    path: .tox
                    key: tox-test-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt') }}
            -   name: Check disk space
                run: df . -h

    notebooks:
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                python-version: [
                  # "3.10", # commented out as failing too often
                    "3.11", "3.12", "3.13", "3.14" ]
        steps:
            -   uses: actions/checkout@v6
            -   name: Install ffmpeg
                run: |
                    set -euxo pipefail
                    # https://askubuntu.com/questions/1512042/ubuntu-24-04-getting-error-you-must-put-some-deb-src-uris-in-your-sources-list
                    sudo sed -i 's/^Types: deb/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
                    sudo apt-get update
                    sudo apt-get -y install ffmpeg
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v6
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Start Redis
                uses: supercharge/redis-github-action@1.8.1
                with:
                    redis-version: 7.4.2
                    redis-port: 6379
            # https://adamj.eu/tech/2023/11/02/github-actions-faster-python-virtual-environments/ - skipped on
            # scheduled runs so the nightly cron always exercises a from-scratch install.
            -   name: Restore cached tox environments
                if: ${{ github.event_name != 'schedule' }}
                uses: actions/cache/restore@v5
                with:
                    path: .tox
                    key: tox-notebooks-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt') }}
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install -U tox tox-gh-actions
            -   name: Run notebooks
                run: |
                    tox run -e py${{ matrix.python-version }}-notebooks
                    tox run -e py${{ matrix.python-version }}-notebooks-no-pickle
            -   name: Save cached tox environments
                if: ${{ always() && github.event_name != 'schedule' }}
                uses: actions/cache/save@v5
                with:
                    path: .tox
                    key: tox-notebooks-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt') }}

    examples:
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        steps:
            -   uses: actions/checkout@v6
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v6
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Download Olten scenario
                run: |
                    wget "${{ env.flatland-scenarios-olten-partially-closed-url }}" -O OLTEN_PARTIALLY_CLOSED_v2.zip
                    mkdir -p scenarios/scenario_olten/data
                    unzip OLTEN_PARTIALLY_CLOSED_v2 -d scenarios/scenario_olten/data
            # https://adamj.eu/tech/2023/11/02/github-actions-faster-python-virtual-environments/ - skipped on
            # scheduled runs so the nightly cron always exercises a from-scratch install.
            -   name: Restore cached tox environments
                if: ${{ github.event_name != 'schedule' }}
                uses: actions/cache/restore@v5
                with:
                    path: .tox
                    key: tox-examples-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt') }}
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install -U tox tox-gh-actions
            -   name: Run examples
                run: tox run -e py${{ matrix.python-version }}-examples
            -   name: Save cached tox environments
                if: ${{ always() && github.event_name != 'schedule' }}
                uses: actions/cache/save@v5
                with:
                    path: .tox
                    key: tox-examples-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt') }}

    verify-cython-build:
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        steps:
            -   uses: actions/checkout@v6
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v6
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install tox tox-gh-actions
            -   name: Verify Cython modules are compiled when Cython and gcc are available (default isolated build)
                run: tox run -e py${{ matrix.python-version }}-verify-cython-build
            -   name: Verify Cython modules are compiled when Cython and gcc are available (--no-build-isolation)
                run: tox run -e py${{ matrix.python-version }}-verify-cython-build-no-isolation

    verify-build-fallback:
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@v6
            -   name: Set up Python
                uses: actions/setup-python@v6
                with:
                    python-version: "3.14"
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install tox tox-gh-actions
            -   name: Verify build succeeds without a C compiler
                run: tox run -e verify-build-no-gcc

    build:
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@v6
            -   name: Set up Python
                uses: actions/setup-python@v6
                with:
                    python-version: "3.14"
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install tox tox-gh-actions
            -   name: Build package
                run: tox run -e build
            -   name: Verify dist is a pure-Python sdist (no wheel)
                run: python scripts/verify_cython_extension_build.py --dist-dir dist --artifact sdist --expect pure-python

    profiling:
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            pull-requests: write
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        steps:
            -   uses: actions/checkout@v6
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v6
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Download Olten scenario
                run: |
                    wget "${{ env.flatland-scenarios-olten-partially-closed-url }}" -O OLTEN_PARTIALLY_CLOSED_v2.zip
                    mkdir -p scenarios/scenario_olten/data
                    unzip OLTEN_PARTIALLY_CLOSED_v2 -d scenarios/scenario_olten/data
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install -U tox tox-gh-actions
            # No .tox caching here (unlike the other jobs): this env's profiling output is written under
            # .tox/py${{ matrix.python-version }}-profiling/log, i.e. inside the directory that would be
            # cached - caching it risks uploading a stale profiling log as if it were the current run's.
            -   name: Run profiling
                run: tox run -e py${{ matrix.python-version }}-profiling
            -   uses: actions/upload-artifact@v6
                with:
                    name: upload-profiling-results-${{ matrix.python-version }}
                    path: .tox/py${{ matrix.python-version }}-profiling/log
                    if-no-files-found: error
            -   uses: actions/upload-artifact@v6
                with:
                    name: upload-performance-profiling-results-${{ matrix.python-version }}
                    path: |
                        benchmarks/*.prof
                        benchmarks/*.png
                    if-no-files-found: error
            # Only the env.profiling-python-version leg publishes to a gist and comments on the PR - no need
            # to repeat the same picture for every matrix entry. Restricted to same-repo PRs since forks
            # don't receive secrets (GIST_TOKEN), so the gist/comment step would just fail auth on a fork PR.
            #
            # NOT 3.12: cProfile can't see calls into compiled Cython functions on Python 3.12 at all (not
            # zero-time, just absent from the stats) - confirmed against cython/cython#5470: Python 3.12
            # moved cProfile onto PEP 669's sys.monitoring, and Cython's own sys.monitoring bridge
            # (CYTHON_USE_SYS_MONITORING) is gated to PY_VERSION_HEX >= 0x030d00b1, i.e. Python 3.13+ only -
            # verified empirically that this is unaffected by the Cython version (reproduced identically with
            # both the pinned cython==3.2.9 and the previously-pinned 3.3.0a1; only the Python version
            # matters). Python 3.13 is the first version where get_k_shortest_paths (and any other
            # @cython.profile(True) function) actually shows up in the .prof output.
            -   name: Report overall profiling result
                if: >-
                    ${{ github.event_name == 'pull_request' && matrix.python-version == env.profiling-python-version &&
                    github.event.pull_request.head.repo.full_name == github.repository }}
                uses: ./.github/actions/profiling-comment
                with:
                    comment-marker: flatland-ci-profiling-overall
                    title: "Performance profiling (Python ${{ env.profiling-python-version }})"
                    image-alt: "performance overall"
                    png-path: benchmarks/performance_overall.png
                    gist-filename-suffix: performance_overall.png
                    gist-token: ${{ secrets.GIST_TOKEN }}

    profiling-get-k-shortest-paths:
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            pull-requests: write
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        steps:
            -   uses: actions/checkout@v6
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v6
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Download ecml2026 scenario
                run: |
                    wget "${{ env.ecml2026-pkl }}" -O level_0_scenario_1.pkl
                    wget "${{ env.ecml2026-stations-pkl }}" -O stations.pkl
                working-directory: ${{ github.workspace }}
            # https://adamj.eu/tech/2023/11/02/github-actions-faster-python-virtual-environments/ - skipped on
            # scheduled runs so the nightly cron always exercises a from-scratch install.
            -   name: Restore cached tox environments
                if: ${{ github.event_name != 'schedule' }}
                uses: actions/cache/restore@v5
                with:
                    path: .tox
                    key: tox-profiling-get-k-shortest-paths-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt') }}
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install -U tox tox-gh-actions
            -   name: Run profiling
                run: tox run -e py${{ matrix.python-version }}-profiling-get-k-shortest-paths
            -   name: Save cached tox environments
                if: ${{ always() && github.event_name != 'schedule' }}
                uses: actions/cache/save@v5
                with:
                    path: .tox
                    key: tox-profiling-get-k-shortest-paths-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt') }}
            -   uses: actions/upload-artifact@v6
                with:
                    name: upload-profiling-get-k-shortest-paths-results-${{ matrix.python-version }}
                    path: |
                        benchmarks/*.prof
                        benchmarks/*.png
                    if-no-files-found: error
            # See the `profiling` job above for why this is gated to env.profiling-python-version (not 3.12)
            # and same-repo PRs only - cProfile can't see compiled Cython calls on 3.12 (cython/cython#5470).
            -   name: Report get_k_shortest_paths profiling result
                if: >-
                    ${{ github.event_name == 'pull_request' && matrix.python-version == env.profiling-python-version &&
                    github.event.pull_request.head.repo.full_name == github.repository }}
                uses: ./.github/actions/profiling-comment
                with:
                    comment-marker: flatland-ci-profiling-get-k-shortest-paths
                    title: "`get_k_shortest_paths` profiling (Python ${{ env.profiling-python-version }})"
                    image-alt: "get_k_shortest_paths profiling"
                    png-path: benchmarks/performance_get_k_shortest_paths.png
                    gist-filename-suffix: performance_get_k_shortest_paths.png
                    gist-token: ${{ secrets.GIST_TOKEN }}

    benchmarks:
        if: ${{ github.event.inputs.run_benchmarks || github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        steps:
            -   uses: actions/checkout@v6
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v6
                with:
                    python-version: ${{ matrix.python-version }}
            # The archive is versioned in its URL (v5), so a plain URL-keyed cache is safe indefinitely -
            # no invalidation is needed until the workflow itself is updated to a new URL.
            -   name: Restore cached episodes
                id: cache-episodes
                uses: actions/cache/restore@v5
                with:
                    path: episodes
                    key: episodes-${{ env.flatland-benchmarks-episodes-url }}
            -   name: Download episodes
                if: steps.cache-episodes.outputs.cache-hit != 'true'
                run: |
                    wget "${{ env.flatland-benchmarks-episodes-url }}" -O FLATLAND_BENCHMARK_EPISODES_FOLDER.zip
                    mkdir -p episodes
                    unzip FLATLAND_BENCHMARK_EPISODES_FOLDER -d episodes
                working-directory: ${{ github.workspace }}
            -   name: Save cached episodes
                if: ${{ always() && steps.cache-episodes.outputs.cache-hit != 'true' }}
                uses: actions/cache/save@v5
                with:
                    path: episodes
                    key: episodes-${{ env.flatland-benchmarks-episodes-url }}
            -   name: Download ecml2026 scenario
                run: wget "${{ env.ecml2026-pkl }}" -O level_0_scenario_1.pkl
                working-directory: ${{ github.workspace }}
            # https://adamj.eu/tech/2023/11/02/github-actions-faster-python-virtual-environments/ - skipped on
            # scheduled runs so the nightly cron always exercises a from-scratch install.
            -   name: Restore cached tox environments
                if: ${{ github.event_name != 'schedule' }}
                uses: actions/cache/restore@v5
                with:
                    path: .tox
                    key: tox-benchmarks-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt') }}
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install -U tox tox-gh-actions
            -   name: Run benchmarks
                run: tox run -e py${{ matrix.python-version }}-benchmarks
            -   name: Save cached tox environments
                if: ${{ always() && github.event_name != 'schedule' }}
                uses: actions/cache/save@v5
                with:
                    path: .tox
                    key: tox-benchmarks-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('tox.ini', 'requirements-dev.txt') }}
            -   uses: actions/upload-artifact@v6
                with:
                    name: upload-benchmarks-results-${{ matrix.python-version }}
                    path: benchmarks.hprof
                    if-no-files-found: error
