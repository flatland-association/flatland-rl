name: Publish package

env:
    flatland-benchmarks-episodes-url: "https://github.com/flatland-association/flatland-scenarios/raw/refs/heads/main/trajectories/FLATLAND_BENCHMARK_EPISODES_FOLDER_v5.zip"

on:
    push:
        branches: [ "main" ]
    workflow_dispatch:
        inputs:
            version:
                description: "Version number to publish to Test PyPI (leave empty to skip publishing)"
                required: false
                type: string

jobs:
    actionlint:
        # Static analysis of .github/workflows/*.yml itself - catches invalid expressions/`if:` typos and
        # (via its shellcheck integration) `run:` steps that interpolate untrusted `${{ }}` input directly
        # into shell instead of routing it through `env:`, the exact script-injection shape fixed below.
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@v6
            -   name: Download actionlint
                id: get_actionlint
                run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
                shell: bash
            -   name: Run actionlint
                run: ${{ steps.get_actionlint.outputs.executable }} -color
                shell: bash

    release-please:
        if: ${{ github.event_name == 'push' }}
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            -   uses: googleapis/release-please-action@v4
                id: release

    # Runs the full test matrix before either publish flow below: for a real release (gated on
    # release-please having just created one) or a manual Test PyPI publish (gated on a version being given).
    test:
        # N.B. needs !failure() && !cancelled() because release-please is skipped (not run) on workflow_dispatch,
        # and a skipped dependency makes the implicit needs-success() check fail, which would otherwise skip this job too.
        # Acknowledged GitHub limitation: https://github.com/orgs/community/discussions/45058
        if: >-
            ${{ !failure() && !cancelled() &&
            ((github.event_name == 'push' && needs.release-please.outputs.release_created) ||
            (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
        needs: [ release-please ]
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        steps:
            -   name: Inspect disk
                run: |
                    df -h
                    docker system df
            # https://stackoverflow.com/questions/30604846/docker-complains-about-no-space-left-on-device-how-to-clean-up
            -   name: Prune docker system
                run: |
                    docker system prune --all --force
            # https://www.dzombak.com/blog/2024/09/freeing-disk-space-on-github-actions-runners/
            -   name: Free disk space
                run: |
                    curl -fsSL https://raw.githubusercontent.com/kou/arrow/e49d8ae15583ceff03237571569099a6ad62be32/ci/scripts/util_free_space.sh | bash
            -   name: Inspect disk again
                run: |
                    df -h
                    docker system df
            -   name: Install ffmpeg
                run: |
                    set -euxo pipefail
                    # https://askubuntu.com/questions/1512042/ubuntu-24-04-getting-error-you-must-put-some-deb-src-uris-in-your-sources-list
                    sudo sed -i 's/^Types: deb/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
                    sudo apt-get update
                    sudo apt-get -y install ffmpeg
                    # TODO As long as scipy is pinned to < 1.16 (to ensure to support for Python 3.10), we need to install it from source
                    # https://docs.scipy.org/doc/scipy/building/index.html
                    sudo apt-get -y build-dep scipy
                    # scipy's build-dep pulls in an old pybind11-dev that meson picks up via pkg-config ahead of
                    # the newer pip-installed pybind11, breaking contourpy's from-source build on newer Pythons
                    sudo apt-get -y remove pybind11-dev || true
            -   uses: actions/checkout@v6
                with:
                    ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v6
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Download episodes
                run: |
                    wget "${{ env.flatland-benchmarks-episodes-url }}" -O FLATLAND_BENCHMARK_EPISODES_FOLDER.zip
                    mkdir -p episodes
                    unzip FLATLAND_BENCHMARK_EPISODES_FOLDER -d episodes
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install tox tox-gh-actions
            -   name: Run tests
                run: tox -e py${{ matrix.python-version }},py${{ matrix.python-version }}-verify-install
            -   name: Check disk space
                run: df . -h

    publish-pypi:
        if: ${{ github.event_name == 'push' && needs.release-please.outputs.release_created }}
        needs: [ release-please, test ]
        runs-on: ubuntu-24.04
        environment: pypi
        # https://docs.pypi.org/trusted-publishers/using-a-publisher/
        permissions:
            id-token: write
        outputs:
            version_tag: ${{ needs.release-please.outputs.tag_name }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ needs.release-please.outputs.tag_name }}
            -   name: Set up Python
                uses: actions/setup-python@v6
                with:
                    python-version: "3.14"
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    pip install tox tox-gh-actions
            -   name: Build new package
                run: tox run -e build
            -   name: Verify dist is pure Python
                run: python scripts/verify_cython_extension_build.py --dist-dir dist --expect pure-python
            -   name: Publish package to PyPI
                uses: pypa/gh-action-pypi-publish@release/v1
                with:
                    packages-dir: dist/
            -   name: Archive package
                uses: actions/upload-artifact@v6
                with:
                    name: python-package
                    path: dist/

    publish-test-pypi:
        # N.B. needs !failure() && !cancelled(): w/o a status-check function, GitHub implicitly ANDs the condition
        # with success(), which looks at the whole transitive ancestor chain (publish-test-pypi -> test -> release-please),
        # not just the direct `test` need. release-please is always skipped on workflow_dispatch, which would otherwise
        # poison success() two hops down and skip this job even when test itself succeeded. Acknowledged GitHub limitation:
        # https://github.com/orgs/community/discussions/45058
        if: ${{ !failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        needs: [ test ]
        runs-on: ubuntu-24.04
        environment: test-pypi
        # https://docs.pypi.org/trusted-publishers/using-a-publisher/
        permissions:
            id-token: write
        outputs:
            version_tag: v${{ steps.normalize-version.outputs.version }}
        steps:
            # `version` is meant to be entered without a leading "v" (e.g. "4.3.0"), matching the "v" this
            # workflow itself prepends below. setuptools_scm/packaging silently normalizes away a leading "v"
            # (PEP 440 allows it), so the PyPI publish succeeds either way - but our own `v${{ inputs.version }}`
            # does not, so a user-supplied "v" doubles up:
            #
            # | you type   | SETUPTOOLS_SCM_PRETEND_VERSION | PyPI package version | version_tag -> Docker tag |
            # |------------|---------------------------------|-----------------------|----------------------------|
            # | 4.3.0      | 4.3.0                            | 4.3.0 (correct)       | v4.3.0 (correct)           |
            # | v4.3.0     | v4.3.0                           | 4.3.0 (still correct) | vv4.3.0 (WRONG, doubled)   |
            #
            # Strip an optional leading "v"/"V" here so both inputs behave identically end-to-end.
            -   name: Normalize version (strip optional leading "v"/"V")
                id: normalize-version
                env:
                    # Route the untrusted workflow_dispatch input through env instead of interpolating
                    # it directly into the script - the latter is a known GitHub Actions script-injection
                    # vector (a value like `"; rm -rf /` breaks out of the shell string).
                    VERSION_INPUT: ${{ inputs.version }}
                run: |
                    version="$VERSION_INPUT"
                    while [[ "$version" == [vV]* ]]; do
                        version="${version:1}"
                    done
                    if [[ -z "$version" ]]; then
                        echo "::error::version input normalized to an empty string (got \"$VERSION_INPUT\") - provide a version number, e.g. \"4.3.0\"." >&2
                        exit 1
                    fi
                    echo "version=$version" >> "$GITHUB_OUTPUT"
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    fetch-depth: 0
            -   name: Set up Python
                uses: actions/setup-python@v6
                with:
                    python-version: "3.14"
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    pip install tox tox-gh-actions
            -   name: Build new package
                env:
                    SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.normalize-version.outputs.version }}
                run: tox run -e build
            -   name: Publish package to Test PyPI
                uses: pypa/gh-action-pypi-publish@release/v1
                with:
                    repository-url: https://test.pypi.org/legacy/
                    packages-dir: dist/
            -   name: Archive package
                uses: actions/upload-artifact@v6
                with:
                    name: python-package
                    path: dist/

    docker-publish:
        # Runs after whichever publish flow ran - the other is always skipped, so the default
        # needs-implies-success() condition would otherwise block this job.
        if: ${{ !cancelled() && (needs.publish-pypi.result == 'success' || needs.publish-test-pypi.result == 'success') }}
        needs: [ publish-pypi, publish-test-pypi ]
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        env:
            REGISTRY: ghcr.io
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.12" ]
                variant:
                    -   name: default
                        with-ml: "false"
                        tag-suffix: ""
                    -   name: ml
                        with-ml: "true"
                        tag-suffix: "-ml"
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
            -   name: Resolve version tag and flatland-rl ref
                id: version
                run: |
                    if [ -n "${{ needs.publish-pypi.outputs.version_tag }}" ]; then
                        echo "VERSION_TAG=${{ needs.publish-pypi.outputs.version_tag }}" >> "$GITHUB_OUTPUT"
                        echo "FLATLAND_RL_REF=${{ needs.publish-pypi.outputs.version_tag }}" >> "$GITHUB_OUTPUT"
                    else
                        echo "VERSION_TAG=${{ needs.publish-test-pypi.outputs.version_tag }}" >> "$GITHUB_OUTPUT"
                        echo "FLATLAND_RL_REF=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
                    fi
            -   name: Log in to GHCR
                uses: docker/login-action@v3
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
            -   name: Set up QEMU
                uses: docker/setup-qemu-action@v3
            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3
            -   name: Build image name
                id: image-name
                run: echo "IMAGE_NAME=$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
            -   name: Build and push image
                uses: docker/build-push-action@v6
                with:
                    context: .
                    platforms: linux/amd64,linux/arm64
                    build-args: |
                        PYTHON_VERSION=${{ matrix.python-version }}
                        WITH_ML=${{ matrix.variant.with-ml }}
                        FLATLAND_RL_REF=${{ steps.version.outputs.FLATLAND_RL_REF }}
                    no-cache: true
                    push: true
                    tags: ${{ steps.image-name.outputs.IMAGE_NAME }}:${{ steps.version.outputs.VERSION_TAG }}-py${{ matrix.python-version }}${{ matrix.variant.tag-suffix }}
