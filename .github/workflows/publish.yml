name: Publish package

on:
    push:
        branches: [ "main" ]
    workflow_dispatch:
        inputs:
            version:
                description: "Version number to publish to Test PyPI (leave empty to skip publishing)"
                required: false
                type: string

jobs:
    actionlint:
        # Static analysis of .github/workflows/*.yml itself - catches invalid expressions/`if:` typos and
        # (via its shellcheck integration) `run:` steps that interpolate untrusted `${{ }}` input directly
        # into shell instead of routing it through `env:`, the exact script-injection shape fixed below.
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@v6
            -   name: Download actionlint
                id: get_actionlint
                run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
                shell: bash
            -   name: Run actionlint
                run: ${{ steps.get_actionlint.outputs.executable }} -color
                shell: bash

    release-please:
        if: ${{ github.event_name == 'push' }}
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            -   uses: googleapis/release-please-action@v4
                id: release

    # Builds the same CI-env image checks.yml uses (see build-ci-env.yml) rather than reinstalling
    # requirements-dev.txt from scratch on a bare runner every release - shares GHCR's warm cache with
    # checks.yml's own runs instead of redoing that work here.
    build-ci-env-default:
        # See test's identical condition below for why !failure() && !cancelled() is needed here too.
        if: >-
            ${{ !failure() && !cancelled() &&
            ((github.event_name == 'push' && needs.release-please.outputs.release_created) ||
            (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
        needs: [ release-please ]
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        uses: ./.github/workflows/build-ci-env.yml
        with:
            python-version: ${{ matrix.python-version }}
            with-ml: false
            ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

    # Runs the full test matrix before either publish flow below: for a real release (gated on
    # release-please having just created one) or a manual Test PyPI publish (gated on a version being
    # given). See run-ci-env-test.yml (shared with checks.yml's own test job) for the actual test invocation.
    test:
        # N.B. needs !failure() && !cancelled() because release-please is skipped (not run) on workflow_dispatch,
        # and a skipped dependency makes the implicit needs-success() check fail, which would otherwise skip this job too.
        # Acknowledged GitHub limitation: https://github.com/orgs/community/discussions/45058
        if: >-
            ${{ !failure() && !cancelled() &&
            ((github.event_name == 'push' && needs.release-please.outputs.release_created) ||
            (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
        needs: [ release-please, build-ci-env-default ]
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        uses: ./.github/workflows/run-ci-env-test.yml
        with:
            python-version: ${{ matrix.python-version }}
            image-hash: ${{ needs.build-ci-env-default.outputs.image-hash }}
            ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

    publish-pypi:
        if: ${{ github.event_name == 'push' && needs.release-please.outputs.release_created }}
        needs: [ release-please, test ]
        runs-on: ubuntu-24.04
        environment: pypi
        # https://docs.pypi.org/trusted-publishers/using-a-publisher/
        permissions:
            id-token: write
        outputs:
            version_tag: ${{ needs.release-please.outputs.tag_name }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ needs.release-please.outputs.tag_name }}
            -   name: Set up Python
                uses: actions/setup-python@v6
                with:
                    python-version: "3.14"
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    pip install tox tox-gh-actions
            -   name: Build new package
                run: tox run -e build
            -   name: Verify dist is a pure-Python sdist (no wheel)
                run: python scripts/verify_cython_extension_build.py --dist-dir dist --artifact sdist --expect pure-python
            -   name: Publish package to PyPI
                uses: pypa/gh-action-pypi-publish@release/v1
                with:
                    packages-dir: dist/
            -   name: Archive package
                uses: actions/upload-artifact@v6
                with:
                    name: python-package
                    path: dist/

    publish-test-pypi:
        # N.B. needs !failure() && !cancelled(): w/o a status-check function, GitHub implicitly ANDs the condition
        # with success(), which looks at the whole transitive ancestor chain (publish-test-pypi -> test -> release-please),
        # not just the direct `test` need. release-please is always skipped on workflow_dispatch, which would otherwise
        # poison success() two hops down and skip this job even when test itself succeeded. Acknowledged GitHub limitation:
        # https://github.com/orgs/community/discussions/45058
        if: ${{ !failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        needs: [ test ]
        runs-on: ubuntu-24.04
        environment: test-pypi
        # https://docs.pypi.org/trusted-publishers/using-a-publisher/
        permissions:
            id-token: write
        outputs:
            version_tag: v${{ steps.normalize-version.outputs.version }}
        steps:
            # `version` is meant to be entered without a leading "v" (e.g. "4.3.0"), matching the "v" this
            # workflow itself prepends below. setuptools_scm/packaging silently normalizes away a leading "v"
            # (PEP 440 allows it), so the PyPI publish succeeds either way - but our own `v${{ inputs.version }}`
            # does not, so a user-supplied "v" doubles up:
            #
            # | you type   | SETUPTOOLS_SCM_PRETEND_VERSION | PyPI package version | version_tag -> Docker tag |
            # |------------|---------------------------------|-----------------------|----------------------------|
            # | 4.3.0      | 4.3.0                            | 4.3.0 (correct)       | v4.3.0 (correct)           |
            # | v4.3.0     | v4.3.0                           | 4.3.0 (still correct) | vv4.3.0 (WRONG, doubled)   |
            #
            # Strip an optional leading "v"/"V" here so both inputs behave identically end-to-end.
            -   name: Normalize version (strip optional leading "v"/"V")
                id: normalize-version
                env:
                    # Route the untrusted workflow_dispatch input through env instead of interpolating
                    # it directly into the script - the latter is a known GitHub Actions script-injection
                    # vector (a value like `"; rm -rf /` breaks out of the shell string).
                    VERSION_INPUT: ${{ inputs.version }}
                run: |
                    version="$VERSION_INPUT"
                    while [[ "$version" == [vV]* ]]; do
                        version="${version:1}"
                    done
                    if [[ -z "$version" ]]; then
                        echo "::error::version input normalized to an empty string (got \"$VERSION_INPUT\") - provide a version number, e.g. \"4.3.0\"." >&2
                        exit 1
                    fi
                    echo "version=$version" >> "$GITHUB_OUTPUT"
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    fetch-depth: 0
            -   name: Set up Python
                uses: actions/setup-python@v6
                with:
                    python-version: "3.14"
            -   name: Install tox
                run: |
                    python -m pip install --upgrade pip
                    pip install tox tox-gh-actions
            -   name: Build new package
                env:
                    SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.normalize-version.outputs.version }}
                run: tox run -e build
            -   name: Publish package to Test PyPI
                uses: pypa/gh-action-pypi-publish@release/v1
                with:
                    repository-url: https://test.pypi.org/legacy/
                    packages-dir: dist/
            -   name: Archive package
                uses: actions/upload-artifact@v6
                with:
                    name: python-package
                    path: dist/

    # Resolves what docker-publish below needs before it can call build-docker-image.yml (a `uses:` job
    # can't have its own preceding steps). Runs after whichever publish flow ran - the other is always
    # skipped, so the default needs-implies-success() condition would otherwise block this job.
    resolve-docker-publish-ref:
        if: ${{ !cancelled() && (needs.publish-pypi.result == 'success' || needs.publish-test-pypi.result == 'success') }}
        needs: [ publish-pypi, publish-test-pypi ]
        runs-on: ubuntu-24.04
        outputs:
            version_tag: ${{ steps.version.outputs.VERSION_TAG }}
            flatland_rl_ref: ${{ steps.version.outputs.FLATLAND_RL_REF }}
        steps:
            -   name: Resolve version tag and flatland-rl ref
                id: version
                run: |
                    if [ -n "${{ needs.publish-pypi.outputs.version_tag }}" ]; then
                        echo "VERSION_TAG=${{ needs.publish-pypi.outputs.version_tag }}" >> "$GITHUB_OUTPUT"
                        echo "FLATLAND_RL_REF=${{ needs.publish-pypi.outputs.version_tag }}" >> "$GITHUB_OUTPUT"
                    else
                        echo "VERSION_TAG=${{ needs.publish-test-pypi.outputs.version_tag }}" >> "$GITHUB_OUTPUT"
                        echo "FLATLAND_RL_REF=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
                    fi

    # See build-docker-image.yml (shared with docker.yml's own docker-publish job) for the actual
    # build/skip-if-unchanged/retag logic. Needs its own explicit guard here (same reasoning as
    # publish-test-pypi's above): the implicit needs-success() check walks the *whole* transitive
    # ancestor chain, not just the direct `resolve-docker-publish-ref` need - so on a real release
    # (a push event), publish-test-pypi being skipped by design would poison this job too, one hop
    # further out through resolve-docker-publish-ref, silently skipping the Docker publish on every
    # release (confirmed: this is exactly what happened for the 4.3.0 release).
    docker-publish:
        if: ${{ !failure() && !cancelled() && needs.resolve-docker-publish-ref.result == 'success' }}
        needs: [ resolve-docker-publish-ref ]
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.12" ]
                variant:
                    -   name: default
                        with-ml: false
                        tag-suffix: ""
                    -   name: ml
                        with-ml: true
                        tag-suffix: "-ml"
        uses: ./.github/workflows/build-docker-image.yml
        with:
            python-version: ${{ matrix.python-version }}
            with-ml: ${{ matrix.variant.with-ml }}
            flatland-rl-ref: ${{ needs.resolve-docker-publish-ref.outputs.flatland_rl_ref }}
            human-facing-tag: ${{ needs.resolve-docker-publish-ref.outputs.version_tag }}-py${{ matrix.python-version }}${{ matrix.variant.tag-suffix }}
