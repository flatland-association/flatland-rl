name: Build and publish Docker image

on:
    workflow_dispatch:
    push:
        branches: [ "main" ]
    pull_request:
    schedule:
        -   cron: '0 3 * * *'

env:
    REGISTRY: ghcr.io

jobs:
    actionlint:
        # Static analysis of .github/workflows/*.yml itself - catches invalid expressions/`if:` typos and
        # (via its shellcheck integration) `run:` steps that interpolate untrusted `${{ }}` input directly
        # into shell instead of routing it through `env:`.
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@v6
            -   name: Download actionlint
                id: get_actionlint
                run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
                shell: bash
            -   name: Run actionlint
                run: ${{ steps.get_actionlint.outputs.executable }} -color
                shell: bash

    docker-publish:
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.12" ]
                variant:
                    -   name: default
                        with-ml: "false"
                        tag-suffix: ""
                    -   name: ml
                        with-ml: "true"
                        tag-suffix: "-ml"
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
            -   name: Log in to GHCR
                if: ${{ github.event_name != 'pull_request' }}
                uses: docker/login-action@v4
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
            -   name: Set up QEMU
                uses: docker/setup-qemu-action@v4
            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v4
            -   name: Build image name
                id: image-name
                run: echo "IMAGE_NAME=$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
            -   name: Build and push image
                uses: docker/build-push-action@v7
                with:
                    context: .
                    platforms: linux/amd64,linux/arm64
                    build-args: |
                        PYTHON_VERSION=${{ matrix.python-version }}
                        WITH_ML=${{ matrix.variant.with-ml }}
                    no-cache: true
                    push: ${{ github.event_name != 'pull_request' }}
                    tags: ${{ steps.image-name.outputs.IMAGE_NAME }}:latest-py${{ matrix.python-version }}${{ matrix.variant.tag-suffix }}
