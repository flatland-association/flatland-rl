name: Post profiling PR comment
description: >-
    Shared tail of checks.yml's profiling/profiling-get-k-shortest-paths jobs: publishes a profiling PNG to
    the one gist shared across every PR, then creates/updates a single PR comment embedding it. Generic over
    which specific profiling run it's reporting (see inputs) so the two jobs share this instead of each
    maintaining its own near-identical copy of the gist/comment steps.

inputs:
    comment-marker:
        description: >-
            HTML comment tag used both to find an existing comment to replace and as this comment's own hidden
            identity marker, e.g. flatland-ci-profiling-overall (without the surrounding <!-- -->).
        required: true
    title:
        description: >-
            Comment heading text, without the leading "### 📈 " or the trailing "— commit ...", e.g.
            "Performance profiling (Python 3.13)".
        required: true
    image-alt:
        description: Alt text for the embedded profiling image.
        required: true
    png-path:
        description: Path to the profiling PNG to publish, relative to the repo root, e.g. benchmarks/performance_overall.png.
        required: true
    gist-filename-suffix:
        description: Suffix for the per-PR gist filename (prefixed with pr<number>_), e.g. performance_overall.png.
        required: true
    gist-token:
        description: >-
            Classic PAT with the `gist` scope (secrets.GIST_TOKEN) - the default GITHUB_TOKEN can't be used
            here: it's a repo-scoped GitHub App installation token, and gists are a user-account-level
            resource with no corresponding repo permission to grant it (a fine-grained PAT won't work either,
            those don't cover gists).
        required: true

runs:
    using: composite
    steps:
        -   name: Find existing comment
            id: find-comment
            uses: peter-evans/find-comment@v3
            with:
                issue-number: ${{ github.event.pull_request.number }}
                comment-author: 'github-actions[bot]'
                body-includes: <!-- ${{ inputs.comment-marker }} -->
        -   name: Create or update gist with profiling result
            id: gist
            shell: bash
            env:
                # only the gist's owner (the account that owns GIST_TOKEN) can push updates to it - gists have
                # no collaborator model
                GH_TOKEN: ${{ inputs.gist-token }}
                # one gist shared by both profiling jobs, across every PR:
                # https://gist.github.com/flatland-competition/6f2b1d5d6e3ee80f57edab68215a05ef
                GIST_ID: 6f2b1d5d6e3ee80f57edab68215a05ef
                PR_SHA: ${{ github.event.pull_request.head.sha }}
                # named per PR only (not per commit) - the PR number already disambiguates within the shared
                # gist, so each new commit on a PR safely overwrites that PR's own file. Built here (not
                # inline in the script below) to keep the `${{ }}` GitHub Actions expression interpolation
                # routed through `env:` rather than directly into a shell script, matching the rest of this
                # repo's workflows.
                FILENAME: pr${{ github.event.pull_request.number }}_${{ inputs.gist-filename-suffix }}
                PNG_PATH: ${{ inputs.png-path }}
            run: |
                short_sha=${PR_SHA:0:7}
                # `gh gist create` rejects binary files outright, and the gists API's `content` field is
                # text-only - so we go through git directly (a gist is just a git repo under the hood, which
                # accepts binary content fine).
                git clone "https://gist.github.com/$GIST_ID.git" gist_dir
                # Auth via a header (not a token embedded in the remote URL): gist.github.com redirects the
                # clone/push URL (e.g. to add a trailing slash), and git drops URL-embedded credentials when
                # it follows a redirect, causing push to fail non-interactively ("could not read Username").
                # A host-scoped extraheader survives the redirect since it's attached by URL prefix rather
                # than tied to one resolved URL.
                git -C gist_dir config "http.https://gist.github.com/.extraheader" \
                    "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
                cp "$PNG_PATH" "gist_dir/$FILENAME"
                git -C gist_dir -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
                    add "$FILENAME"
                git -C gist_dir -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
                    commit --allow-empty -m "Add profiling png for PR #${{ github.event.pull_request.number }}, $PR_SHA"
                git -C gist_dir push
                raw_url=$(gh api "gists/$GIST_ID" --jq ".files[\"$FILENAME\"].raw_url")
                {
                    echo "url=https://gist.github.com/$GIST_ID"
                    echo "raw_url=$raw_url"
                    echo "short_sha=$short_sha"
                } >> "$GITHUB_OUTPUT"
        -   name: Create or update comment
            uses: peter-evans/create-or-update-comment@v4
            with:
                comment-id: ${{ steps.find-comment.outputs.comment-id }}
                issue-number: ${{ github.event.pull_request.number }}
                edit-mode: replace
                body: |
                    <!-- ${{ inputs.comment-marker }} -->
                    ### 📈 ${{ inputs.title }} — commit [`${{ steps.gist.outputs.short_sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }})

                    ![${{ inputs.image-alt }}](${{ steps.gist.outputs.raw_url }})

                    _Updated by [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · [gist](${{ steps.gist.outputs.url }})._
